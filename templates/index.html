<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python FAQ Chatbot — CodeAlpha AI Internship</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { color: #1f2937; font-size: 26px; }
    header p { color: #6b7280; font-size: 14px; margin-top: 4px; }
    #chat-box {
      width: 100%;
      max-width: 640px;
      height: 55vh;
      min-height: 300px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user-message {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .bot-message {
      align-self: flex-start;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .bot-message .meta {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #6b7280;
    }
    #input-row {
      width: 100%;
      max-width: 640px;
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    #user-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
    }
    #user-input:focus { border-color: #2563eb; }
    #send-btn {
      padding: 12px 22px;
      font-size: 15px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #send-btn:hover { background: #1d4ed8; }
    .suggestions {
      width: 100%;
      max-width: 640px;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .suggestions span {
      cursor: pointer;
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>&#128187; Python FAQ Chatbot</h1>
    <p>Ask me anything about learning Python programming</p>
  </header>

  <div id="chat-box">
    <div class="message bot-message">Hi! I'm a FAQ chatbot for learning Python. Ask me about functions, loops, lists, dictionaries, classes, pip, or error handling.</div>
  </div>

  <div id="input-row">
    <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <p class="suggestions">
    Try:
    <span onclick="askSuggestion('How do I define a function in Python?')">How do I define a function?</span> &middot;
    <span onclick="askSuggestion('What is the difference between a list and a tuple?')">List vs tuple?</span> &middot;
    <span onclick="askSuggestion('How do I handle errors in Python?')">Error handling?</span>
  </p>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");

    function addMessage(text, isUser, meta) {
      const div = document.createElement("div");
      div.className = "message " + (isUser ? "user-message" : "bot-message");
      div.textContent = text;
      if (meta) {
        const metaSpan = document.createElement("span");
        metaSpan.className = "meta";
        metaSpan.textContent = meta;
        div.appendChild(metaSpan);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const question = userInput.value.trim();
      if (!question) return;
      addMessage(question, true);
      userInput.value = "";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question })
        });
        const data = await response.json();
        const meta = data.matched_question
          ? `Matched: "${data.matched_question}" (similarity: ${data.similarity})`
          : `Similarity: ${data.similarity}`;
        addMessage(data.answer, false, meta);
      } catch (error) {
        addMessage("Sorry, something went wrong. Please make sure the server is running and try again.", false);
      }
    }

    function askSuggestion(question) {
      userInput.value = question;
      sendMessage();
    }

    userInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") sendMessage();
    });
    userInput.focus();
  </script>
</body>
</html>
